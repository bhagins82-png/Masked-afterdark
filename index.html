<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masked After Dark</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080808;
      color: #fff;
    }

    button {
      font-family: inherit;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      background: rgba(0,0,0,.96);
      border-bottom: 1px solid #252525;
    }

    .brand {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    .brand span {
      color: #ddb936;
    }

    .login-btn {
      background: transparent;
      color: white;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: bold;
    }

    .hero {
      padding: 55px 20px 45px;
      text-align: center;
      background:
        radial-gradient(circle at top, #242017 0%, #0c0c0c 45%, #080808 100%);
    }

    .hero h1 {
      margin: 0 0 14px;
      font-size: clamp(38px, 11vw, 62px);
      line-height: 1;
    }

    .hero p {
      max-width: 560px;
      margin: 0 auto;
      color: #aaa;
      font-size: 17px;
      line-height: 1.6;
    }

    .gold-btn {
      margin-top: 26px;
      width: 100%;
      max-width: 360px;
      background: #ddb936;
      color: #080808;
      border: 0;
      border-radius: 10px;
      padding: 15px 22px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }

    .price-note {
      margin-top: 10px;
      color: #777;
      font-size: 13px;
    }

    .feed {
      width: min(680px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 80px;
    }

    .post {
      overflow: hidden;
      margin-bottom: 24px;
      background: #141414;
      border: 1px solid #292929;
      border-radius: 16px;
    }

    .post-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #ddb936;
      color: #000;
      font-weight: 900;
    }

    .post-name {
      font-weight: bold;
    }

    .post-time {
      color: #777;
      font-size: 12px;
      margin-top: 3px;
    }

    .media {
      min-height: 330px;
      display: grid;
      place-items: center;
      padding: 25px;
      text-align: center;
      color: #777;
      background:
        linear-gradient(145deg, #242424, #101010);
    }

    .post-copy {
      padding: 16px;
      line-height: 1.5;
      color: #ddd;
    }

    .locked {
      position: relative;
      min-height: 350px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 28px;
      background:
        linear-gradient(rgba(8,8,8,.65), rgba(8,8,8,.95)),
        linear-gradient(135deg, #393939, #111);
    }
